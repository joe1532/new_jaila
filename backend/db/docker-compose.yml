services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: jaila
      POSTGRES_PASSWORD: jaila
      POSTGRES_DB: jaila_skat
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jaila -d jaila_skat"]
      interval: 5s
      timeout: 3s
      retries: 10
