# Add inside the skat-chat.dk TLS server block.
# The MCP process is independent from the FastAPI backend on port 8010.
location = /mcp {
    proxy_pass http://127.0.0.1:8020;
    proxy_http_version 1.1;

    # MCP SDK validates Host to prevent DNS rebinding. The public host is
    # preserved separately while upstream receives its bound loopback host.
    proxy_set_header Host 127.0.0.1:8020;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;

    proxy_buffering off;
    proxy_request_buffering off;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
}
